services:
  app:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped

    working_dir: /var/www

    expose:
      - "9000"

    environment:
      TZ: ${TZ:-Africa/Addis_Ababa}

    volumes:
      - laravel-storage:/var/www/storage

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

  worker:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped

    working_dir: /var/www

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    environment:
      TZ: ${TZ:-Africa/Addis_Ababa}

    volumes:
      - laravel-storage:/var/www/storage

    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

  scheduler:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped

    working_dir: /var/www

    command: php artisan schedule:work

    environment:
      TZ: ${TZ:-Africa/Addis_Ababa}

    volumes:
      - laravel-storage:/var/www/storage

    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/public:ro
      - laravel-storage:/var/www/storage:ro

    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Africa/Addis_Ababa}
      PGTZ: ${TZ:-Africa/Addis_Ababa}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  laravel-storage: