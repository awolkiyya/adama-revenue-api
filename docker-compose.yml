
services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: adama-revenue-api:latest
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env.production

    volumes:
      - storage:/var/www/storage

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - php -r '$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - storage:/var/www/storage:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - backend

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - backend

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-db
    restart: unless-stopped

    env_file:
      - .env.production

    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  # Laravel Queue Worker
  worker:
    image: adama-revenue-api:latest
    container_name: laravel-worker
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env.production

    volumes:
      - storage:/var/www/storage

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=120

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

    networks:
      - backend

  # Laravel Scheduler
  scheduler:
    image: adama-revenue-api:latest
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www

    env_file:
      - .env.production

    volumes:
      - storage:/var/www/storage

    command:
      - sh
      - -c
      - 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

    networks:
      - backend

  # Optional pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    profiles:
      - tools

    ports:
      - "127.0.0.1:8081:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  storage:

networks:
  backend:
    driver: bridge
