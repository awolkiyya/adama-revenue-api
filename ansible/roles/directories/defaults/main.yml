
---
# Deployment root
deployment_base_dir: /opt/adama-revenue-api

# Shared gateway
deployment_gateway_dir: "{{ deployment_base_dir }}/gateway"
deployment_gateway_docker_dir: "{{ deployment_gateway_dir }}/docker"
deployment_gateway_nginx_dir: "{{ deployment_gateway_dir }}/nginx"

# Backup root
deployment_backup_dir: /var/backups/adama-revenue-api

# Environment-specific backups
deployment_production_backup_dir: "{{ deployment_backup_dir }}/production"
deployment_production_postgres_backup_dir: "{{ deployment_production_backup_dir }}/postgresql"

deployment_staging_backup_dir: "{{ deployment_backup_dir }}/staging"
deployment_staging_postgres_backup_dir: "{{ deployment_staging_backup_dir }}/postgresql"

# Ownership
deployment_directory_owner: busadmin
deployment_directory_group: busadmin

# Permissions
deployment_directory_mode: "0755"
deployment_private_directory_mode: "0750"
deployment_backup_directory_mode: "0700"

# Directories managed by Ansible
deployment_directories:
  # Deployment root
  - path: "{{ deployment_base_dir }}"
    owner: root
    group: root
    mode: "0755"

  # Shared gateway
  - path: "{{ deployment_gateway_dir }}"
    owner: "{{ deployment_directory_owner }}"
    group: "{{ deployment_directory_group }}"
    mode: "{{ deployment_private_directory_mode }}"

  - path: "{{ deployment_gateway_docker_dir }}"
    owner: "{{ deployment_directory_owner }}"
    group: "{{ deployment_directory_group }}"
    mode: "{{ deployment_private_directory_mode }}"

  - path: "{{ deployment_gateway_nginx_dir }}"
    owner: "{{ deployment_directory_owner }}"
    group: "{{ deployment_directory_group }}"
    mode: "{{ deployment_private_directory_mode }}"

  # Backup root
  - path: "{{ deployment_backup_dir }}"
    owner: root
    group: root
    mode: "{{ deployment_backup_directory_mode }}"

  # Production PostgreSQL backups
  - path: "{{ deployment_production_backup_dir }}"
    owner: root
    group: root
    mode: "{{ deployment_backup_directory_mode }}"

  - path: "{{ deployment_production_postgres_backup_dir }}"
    owner: root
    group: root
    mode: "{{ deployment_backup_directory_mode }}"

  # Staging PostgreSQL backups
  - path: "{{ deployment_staging_backup_dir }}"
    owner: root
    group: root
    mode: "{{ deployment_backup_directory_mode }}"

  - path: "{{ deployment_staging_postgres_backup_dir }}"
    owner: root
    group: root
    mode: "{{ deployment_backup_directory_mode }}"
