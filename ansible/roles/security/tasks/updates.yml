---
- name: Configure additional unattended upgrade policies
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52ansible-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if security_unattended_upgrades_reboot else 'false' }}";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";
  when: security_unattended_upgrades_enabled

- name: Enable automatic package list updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: security_unattended_upgrades_enabled