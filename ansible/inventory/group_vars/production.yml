---
# ==========================================================
# LARAVEL RUNTIME - PRODUCTION
# ==========================================================

laravel_runtime_enabled: true

laravel_runtime_project_dir: /opt/adama-revenue-api/source-production
laravel_runtime_project_name: adama-revenue-production

laravel_runtime_compose_file: docker/compose.yml
laravel_runtime_env_file: /opt/adama-revenue-api/.env.production
laravel_runtime_override_file: docker/compose.production.yml

laravel_runtime_image: adama-revenue-api:production


# ==========================================================
# POSTGRESQL BACKUP - PRODUCTION
# ==========================================================

# ----------------------------------------------------------
# BACKUP ENABLEMENT
# ----------------------------------------------------------

backup_enabled: true


# ----------------------------------------------------------
# DOCKER COMPOSE CONFIGURATION
# ----------------------------------------------------------

backup_project_dir: "{{ laravel_runtime_project_dir }}"
backup_compose_project: "{{ laravel_runtime_project_name }}"

backup_compose_file: "{{ laravel_runtime_project_dir }}/{{ laravel_runtime_compose_file }}"
backup_compose_override_file: "{{ laravel_runtime_project_dir }}/{{ laravel_runtime_override_file }}"
backup_env_file: "{{ laravel_runtime_env_file }}"


# ----------------------------------------------------------
# POSTGRESQL
# ----------------------------------------------------------

backup_postgres_service: postgres


# ----------------------------------------------------------
# BACKUP STORAGE
# ----------------------------------------------------------

backup_root_dir: /var/backups/adama-revenue-api/production
backup_postgres_dir: "{{ backup_root_dir }}/postgresql"

backup_owner: root
backup_group: root

backup_directory_mode: "0700"
backup_file_mode: "0600"


# ----------------------------------------------------------
# BACKUP SCHEDULE
# ----------------------------------------------------------

# Daily at 01:00 server local time.
backup_schedule_minute: "0"
backup_schedule_hour: "1"
backup_schedule_day: "*"
backup_schedule_month: "*"
backup_schedule_weekday: "*"


# ----------------------------------------------------------
# BACKUP RETENTION
# ----------------------------------------------------------

backup_retention_days: 30


# ----------------------------------------------------------
# BACKUP SCRIPT
# ----------------------------------------------------------

backup_script_path: /usr/local/sbin/adama-revenue-production-backup


# ----------------------------------------------------------
# RESTRICTED SUDO CONFIGURATION
# ----------------------------------------------------------

# Allow buadmin to execute only the production backup script as root.
# No general passwordless sudo access is granted.

backup_sudo_enabled: true
backup_sudo_manage: true

backup_sudo_user: buadmin
backup_sudoers_file: /etc/sudoers.d/adama-revenue-backup


# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------

backup_log_file: /var/log/adama-revenue-production-backup.log


# ----------------------------------------------------------
# LOCK FILE
# ----------------------------------------------------------

backup_lock_file: /var/lock/adama-revenue-production-backup.lock


# ----------------------------------------------------------
# CRON
# ----------------------------------------------------------

backup_cron_job_name: adama-revenue-production-postgresql-backup
backup_cron_user: root


# ----------------------------------------------------------
# REQUIRED SYSTEM PACKAGES
# ----------------------------------------------------------

backup_packages:
  - cron
  - util-linux
  - coreutils
  - findutils
  - grep
  - gawk
