
---
- name: Provision Laravel API server
  hosts: laravel
  become: true
  gather_facts: true

  roles:
    - common
    - security
    - firewall
    - docker
    - directories

    - role: postgres_backup
      tags:
        - postgres_backup

    - monitoring

    - role: laravel_runtime
      tags:
        - laravel_runtime

    - role: ssl
      tags:
        - ssl
