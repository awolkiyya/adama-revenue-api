
name: Laravel API Security

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

  schedule:
    - cron: "0 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-api-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit Composer dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Display PHP and Composer versions
        run: |
          php --version
          composer --version

      - name: Validate Composer lock file
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction
        timeout-minutes: 5
