name: Deploy Laravel Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:
    inputs:
      run_database_migrations:
        description: Run database migrations during this deployment
        required: true
        default: true
        type: boolean

      run_database_seeders:
        description: Run approved reference-data seeders during this deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-laravel-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Laravel staging

    uses: ./.github/workflows/deploy-reusable.yml

    with:
      environment: staging
      run_database_migrations: ${{ inputs.run_database_migrations || false }}
      run_database_seeders: ${{ inputs.run_database_seeders || false }}

    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
      DEPLOY_SSH_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.STAGING_USER }}
