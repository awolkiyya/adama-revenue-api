name: Deploy Laravel Production

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_database_migrations:
        description: Run database migrations (requires a verified production backup)
        required: false
        default: false
        type: boolean

      run_database_seeders:
        description: Run approved reference-data seeders during production deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-laravel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Laravel production

    uses: ./.github/workflows/deploy-reusable.yml

    with:
      environment: production
      run_database_migrations: ${{ github.event_name == 'workflow_dispatch' && inputs.run_database_migrations || false }}
      run_database_seeders: ${{ github.event_name == 'workflow_dispatch' && inputs.run_database_seeders || false }}

    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      DEPLOY_SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.PRODUCTION_USER }}
