name: Deploy Laravel Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-laravel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Laravel production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Configure required reviewers under:
    # GitHub -> Settings -> Environments -> production
    environment:
      name: production

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::PRODUCTION_SSH_KEY is missing."
            exit 1
          }

          test -n "$SSH_KNOWN_HOSTS" || {
            echo "::error::PRODUCTION_KNOWN_HOSTS is missing."
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "Production SSH configuration verified."

      # --------------------------------------------------
      # 3. Validate and package Laravel source
      # --------------------------------------------------

      - name: Package Laravel source
        run: |
          set -Eeuo pipefail

          test -f docker/Dockerfile
          test -f docker/compose.yml
          test -f docker/compose.production.yml
          test -f nginx/default.conf
          test -f public/index.php
          test -f composer.json
          test -f composer.lock

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='certificates' \
            --exclude='gateway' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/laravel-production-source.tar.gz" .

          test -s "$RUNNER_TEMP/laravel-production-source.tar.gz"

          tar -tzf "$RUNNER_TEMP/laravel-production-source.tar.gz" \
            > /dev/null

          echo "Laravel production source package created."
          echo "Commit: $GITHUB_SHA"

      # --------------------------------------------------
      # 4. Transfer source to API server
      # --------------------------------------------------

      - name: Transfer source code
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$PRODUCTION_HOST" || {
            echo "::error::PRODUCTION_HOST is missing."
            exit 1
          }

          test -n "$PRODUCTION_USER" || {
            echo "::error::PRODUCTION_USER is missing."
            exit 1
          }

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$RUNNER_TEMP/laravel-production-source.tar.gz" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/laravel-production-source.tar.gz"

          echo "Production source transferred."

      # --------------------------------------------------
      # 5. Build and deploy Laravel production
      # --------------------------------------------------

      - name: Build and deploy Laravel production
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail

          DEPLOYMENT_LOG="$RUNNER_TEMP/production-deployment.log"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'bash -s' <<'REMOTE' | tee "$DEPLOYMENT_LOG"

          set -Eeuo pipefail

          # ------------------------------------------------
          # Deployment configuration
          # ------------------------------------------------

          APP_ROOT="/opt/adama-revenue-api"

          SOURCE_DIR="$APP_ROOT/source-production"
          ENV_FILE="$APP_ROOT/.env.production"
          ARCHIVE="/tmp/laravel-production-source.tar.gz"

          PROJECT="adama-revenue-production"
          IMAGE="adama-revenue-api:production"

          GATEWAY_COMPOSE_FILE="$APP_ROOT/gateway/docker/compose.gateway.yml"

          # Managed by Ansible.
          BACKUP_DIR="/var/backups/adama-revenue-api/production/postgresql"

          STAGING_NETWORK="adama-revenue-staging_app-network"
          PRODUCTION_NETWORK="adama-revenue-production_app-network"

          export IMAGE

          COMPOSE=(
            docker compose
            --env-file "$ENV_FILE"
            -p "$PROJECT"
            -f "$SOURCE_DIR/docker/compose.yml"
            -f "$SOURCE_DIR/docker/compose.production.yml"
          )

          echo "=========================================="
          echo "LARAVEL PRODUCTION DEPLOYMENT"
          echo "=========================================="

          echo "Started: $(date -Is)"
          echo "Server: $(hostname)"
          echo "Project: $PROJECT"
          echo "Source: $SOURCE_DIR"
          echo "Image: $IMAGE"
          echo "Backup directory: $BACKUP_DIR"

          # ------------------------------------------------
          # Deployment failure diagnostics
          # ------------------------------------------------

          handle_error() {
            local exit_code=$?
            local failed_command="$BASH_COMMAND"

            trap - ERR

            echo ""
            echo "=========================================="
            echo "PRODUCTION DEPLOYMENT FAILED"
            echo "=========================================="

            echo "Exit code: $exit_code"
            echo "Failed command: $failed_command"

            echo ""
            echo "Docker Compose status:"

            "${COMPOSE[@]}" ps -a || true

            for service in app nginx worker scheduler postgres redis; do
              echo ""
              echo "Logs: $service"

              "${COMPOSE[@]}" logs \
                --tail=60 \
                "$service" || true
            done

            exit "$exit_code"
          }

          trap handle_error ERR

          # ------------------------------------------------
          # 1. Validate prerequisites
          # ------------------------------------------------

          echo ""
          echo "[1/12] Checking deployment prerequisites..."

          test -d "$APP_ROOT"
          test -d "$SOURCE_DIR"
          test -s "$ENV_FILE"
          test -s "$ARCHIVE"
          test -s "$GATEWAY_COMPOSE_FILE"
          test -d "$BACKUP_DIR"

          test -w "$SOURCE_DIR" || {
            echo "ERROR: Production source directory is not writable."
            echo "Check Ansible directory ownership and permissions."
            exit 1
          }

          test -w "$BACKUP_DIR" || {
            echo "ERROR: Production backup directory is not writable."
            echo "Check Ansible directory ownership and permissions."
            exit 1
          }

          test -r "$ENV_FILE" || {
            echo "ERROR: Production environment file is not readable."
            exit 1
          }

          docker --version
          docker compose version

          tar -tzf "$ARCHIVE" > /dev/null

          echo "Deployment prerequisites verified."

          # ------------------------------------------------
          # 2. Ensure external gateway networks exist
          # ------------------------------------------------

          echo ""
          echo "[2/12] Checking Docker gateway networks..."

          for NETWORK in "$STAGING_NETWORK" "$PRODUCTION_NETWORK"; do

            if ! docker network inspect "$NETWORK" >/dev/null 2>&1; then

              echo "Creating Docker network: $NETWORK"

              docker network create "$NETWORK"

            else

              echo "Docker network already exists: $NETWORK"

            fi

          done

          # ------------------------------------------------
          # 3. Extract source into temporary directory
          # ------------------------------------------------

          echo ""
          echo "[3/12] Extracting production source..."

          EXTRACT_DIR="$(mktemp -d /tmp/laravel-production.XXXXXX)"

          cleanup() {
            rm -rf -- "$EXTRACT_DIR"
            rm -f -- "$ARCHIVE"
          }

          trap cleanup EXIT

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          test -f "$EXTRACT_DIR/docker/Dockerfile"
          test -f "$EXTRACT_DIR/docker/compose.yml"
          test -f "$EXTRACT_DIR/docker/compose.production.yml"
          test -f "$EXTRACT_DIR/nginx/default.conf"
          test -f "$EXTRACT_DIR/public/index.php"
          test -f "$EXTRACT_DIR/composer.json"
          test -f "$EXTRACT_DIR/composer.lock"

          echo "Production source extracted successfully."

          # ------------------------------------------------
          # 4. Validate existing deployment before replacement
          # ------------------------------------------------

          echo ""
          echo "[4/12] Preparing production source replacement..."

          # Remove the old internal Nginx container before
          # replacing its bind-mounted source directory.

          if [ -f "$SOURCE_DIR/docker/compose.yml" ] && \
             [ -f "$SOURCE_DIR/docker/compose.production.yml" ]; then

            "${COMPOSE[@]}" config -q

            echo "Removing existing internal Nginx container..."

            "${COMPOSE[@]}" rm -sf nginx

          else

            echo "No previous production Nginx deployment found."

          fi

          # ------------------------------------------------
          # 5. Update production source
          # ------------------------------------------------

          echo ""
          echo "[5/12] Replacing production application source..."

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name 'storage' \
            -exec rm -rf -- {} +

          cp -a "$EXTRACT_DIR/." "$SOURCE_DIR/"

          # Never place or symlink .env inside the build context.
          rm -f "$SOURCE_DIR/.env"

          cd "$APP_ROOT"

          echo "Production source replaced."

          # ------------------------------------------------
          # 6. Validate Compose configuration
          # ------------------------------------------------

          echo ""
          echo "[6/12] Validating production Compose configuration..."

          "${COMPOSE[@]}" config -q

          echo "Production Compose configuration validated."

          # ------------------------------------------------
          # 7. Build Laravel production image
          # ------------------------------------------------

          echo ""
          echo "[7/12] Building Laravel production image..."

          docker build \
            --pull \
            -f "$SOURCE_DIR/docker/Dockerfile" \
            -t "$IMAGE" \
            "$SOURCE_DIR"

          docker image inspect "$IMAGE" > /dev/null

          echo "Laravel production image built successfully."

          # ------------------------------------------------
          # 8. Start PostgreSQL and Redis
          # ------------------------------------------------

          echo ""
          echo "[8/12] Starting production infrastructure..."

          "${COMPOSE[@]}" up -d postgres redis

          # ------------------------------------------------
          # 9. Wait for PostgreSQL readiness
          # ------------------------------------------------

          echo ""
          echo "[9/12] Waiting for production PostgreSQL..."

          DB_READY=false

          for attempt in $(seq 1 30); do

            DB_ID="$("${COMPOSE[@]}" ps -q postgres)"

            if [ -n "$DB_ID" ]; then

              DB_STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$DB_ID"
              )"

              echo "PostgreSQL: $DB_STATUS ($attempt/30)"

              if [ "$DB_STATUS" = "healthy" ]; then
                DB_READY=true
                break
              fi

            fi

            sleep 5

          done

          if [ "$DB_READY" != true ]; then

            echo "ERROR: Production PostgreSQL did not become healthy."

            "${COMPOSE[@]}" ps -a

            exit 1

          fi

          # ------------------------------------------------
          # 10. Back up PostgreSQL before deployment
          # ------------------------------------------------

          echo ""
          echo "[10/12] Creating production PostgreSQL backup..."

          # Restrict backup file permissions.
          umask 077

          TIMESTAMP="$(date '+%Y%m%d_%H%M%S')"

          BACKUP_FILE="$BACKUP_DIR/production_pre_deploy_$TIMESTAMP.dump"
          TEMP_BACKUP="$BACKUP_FILE.tmp"

          if ! "${COMPOSE[@]}" exec -T postgres \
            sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
            > "$TEMP_BACKUP"; then

            rm -f "$TEMP_BACKUP"

            echo "ERROR: Production database backup failed."

            exit 1

          fi

          if [ ! -s "$TEMP_BACKUP" ]; then

            rm -f "$TEMP_BACKUP"

            echo "ERROR: Production database backup is empty."

            exit 1

          fi

          mv "$TEMP_BACKUP" "$BACKUP_FILE"

          chmod 600 "$BACKUP_FILE"

          echo "Production backup created successfully."
          echo "Backup file: $BACKUP_FILE"

          # ------------------------------------------------
          # 11. Deploy production application services
          # ------------------------------------------------

          echo ""
          echo "[11/12] Deploying Laravel production services..."

          "${COMPOSE[@]}" up \
            -d \
            --remove-orphans \
            --scale app=1

          # ------------------------------------------------
          # Verify PHP-FPM health
          # ------------------------------------------------

          echo "Waiting for production PHP-FPM health..."

          APP_HEALTHY=false

          for attempt in $(seq 1 30); do

            APP_ID="$("${COMPOSE[@]}" ps -q app)"

            if [ -n "$APP_ID" ]; then

              STATUS="$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "$APP_ID"
              )"

              echo "PHP-FPM: $STATUS ($attempt/30)"

              if [ "$STATUS" = "healthy" ]; then
                APP_HEALTHY=true
                break
              fi

            fi

            sleep 5

          done

          if [ "$APP_HEALTHY" != true ]; then

            echo "ERROR: Production PHP-FPM health check failed."

            "${COMPOSE[@]}" ps -a

            exit 1

          fi

          echo "Production PHP-FPM is healthy."

          # ------------------------------------------------
          # Verify application services
          # ------------------------------------------------

          verify_running() {

            local service="$1"
            local container_id
            local status

            container_id="$("${COMPOSE[@]}" ps -q "$service")"

            if [ -z "$container_id" ]; then

              echo "ERROR: $service container was not created."

              return 1

            fi

            status="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$container_id"
            )"

            echo "$service: $status"

            if [ "$status" != "running" ]; then

              echo "ERROR: $service is not running."

              docker logs --tail 100 "$container_id" || true

              return 1

            fi

          }

          verify_running nginx
          verify_running worker
          verify_running scheduler

          # ------------------------------------------------
          # Verify internal Laravel Nginx
          # ------------------------------------------------

          echo "Testing internal Laravel Nginx..."

          NGINX_ID="$("${COMPOSE[@]}" ps -q nginx)"

          docker exec "$NGINX_ID" nginx -t

          # ------------------------------------------------
          # Verify shared gateway
          # ------------------------------------------------

          echo "Checking shared Nginx gateway..."

          mapfile -t GATEWAY_IDS < <(
            docker ps \
              --filter "publish=80" \
              --format '{{.ID}}'
          )

          if [ "${#GATEWAY_IDS[@]}" -ne 1 ]; then

            echo "ERROR: Expected exactly one running container publishing port 80."

            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'

            exit 1

          fi

          GATEWAY_ID="${GATEWAY_IDS[0]}"

          docker exec "$GATEWAY_ID" nginx -t

          echo "Gateway Nginx configuration is valid."

          # ------------------------------------------------
          # 12. Final deployment verification
          # ------------------------------------------------

          echo ""
          echo "[12/12] Final production deployment verification..."

          "${COMPOSE[@]}" ps

          echo ""
          echo "=========================================="
          echo "PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

          echo "Project: $PROJECT"
          echo "Image: $IMAGE"
          echo "Database migrations: not executed"
          echo "Database seeders: not executed"
          echo "Database backup: $BACKUP_FILE"
          echo "Finished: $(date -Is)"

          echo "PRODUCTION_DEPLOYMENT_SUCCESS"

          REMOTE

          # ------------------------------------------------
          # Verify remote success marker
          # ------------------------------------------------

          if ! grep -Fxq "PRODUCTION_DEPLOYMENT_SUCCESS" "$DEPLOYMENT_LOG"; then

            echo "::error::Remote production deployment did not return its success marker."

            echo "Last 100 lines of remote deployment output:"

            tail -n 100 "$DEPLOYMENT_LOG" || true

            exit 1

          fi

          echo "Verified remote production deployment success."

          echo "deployment_success=true" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6. Production deployment summary
      # --------------------------------------------------

      - name: Production deployment summary
        if: success()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOYMENT_SUCCESS: ${{ steps.staging_deployment.outputs.deployment_success }}
        run: |
          set -Eeuo pipefail

          test "$DEPLOYMENT_SUCCESS" = "true"

          echo "=========================================="
          echo "LARAVEL PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Server: $PRODUCTION_HOST"
          echo "Project: adama-revenue-production"
          echo "Database migrations: manual"
          echo "Database seeders: manual"
          echo "Production database backup: completed"
          echo "Remote health checks: passed"
          echo "Deployment success marker: verified"